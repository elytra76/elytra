plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Dear ImGui. LWJGL is excluded everywhere: Minecraft already provides 3.3.3 on the classpath.
	implementation("io.github.spair:imgui-java-binding:${project.imgui_version}") {
		transitive = false
	}
	implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") {
		transitive = false
	}
	// The native binary is resolved from the classpath at first use, so it has to be
	// on the development runtime classpath as well as inside the shipped jar.
	implementation("io.github.spair:imgui-java-natives-windows:${project.imgui_version}") {
		transitive = false
	}

	// Nested jars: ImGui binding, GL3 renderer, and the native library for the target platform.
	include "io.github.spair:imgui-java-binding:${project.imgui_version}"
	include "io.github.spair:imgui-java-lwjgl3:${project.imgui_version}"
	include "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
